<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Admin Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../assets/js/i18n.js"></script>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <img src="../../assets/images/logo.png" alt="Logo" class="logo">

            <section id="loginPanel">
                <h1>Đăng nhập</h1>
                <p class="subtitle">Nhập thông tin đăng nhập của bạn để truy cập bảng quản trị.</p>

                <div class="form-group">
                    <label for="sdt">Số điện thoại</label>
                    <input type="text" id="sdt" placeholder="03xxxxxxxx" autocomplete="tel" required />
                </div>

                <div class="form-group password-group">
                    <label for="password">Mật khẩu</label>

                    <div class="password-field">
                        <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password"
                            required />
                        <span class="toggle" onclick="togglePassword()" aria-label="Hiển thị/Ẩn mật khẩu">
                            <i data-lucide="eye-off" id="eyeIcon"></i>
                        </span>
                    </div>

                    <p id="loginError" class="error-text"></p>
                </div>

                <div class="auth-options">
                    <label class="remember-option" for="rememberLogin">
                        <input type="checkbox" id="rememberLogin" />
                        <span>Nhớ đăng nhập</span>
                    </label>
                    <button class="link-button" type="button" onclick="showForgotPassword()">Quên mật khẩu?</button>
                </div>

                <button class="primary-button" id="loginButton" onclick="login()">Đăng nhập</button>

                <p class="demo">
                    Tài khoản dùng thử: 09xxxxxxxx / xxxxxxxx
                </p>
            </section>

            <section id="forgotPanel" class="hidden">
                <h1>Quên mật khẩu</h1>
                <p class="subtitle">Nhập số điện thoại admin để nhận OTP và đặt lại mật khẩu.</p>

                <div class="form-group">
                    <label for="forgotPhone">Số điện thoại</label>
                    <input type="text" id="forgotPhone" placeholder="03xxxxxxxx" autocomplete="tel" />
                </div>

                <button class="secondary-button" id="sendOtpButton" onclick="requestResetOtp()">Gửi OTP</button>

                <div id="resetFields" class="hidden">
                    <div class="form-group">
                        <label for="resetOtp">Mã OTP</label>
                        <input type="text" id="resetOtp" placeholder="Nhập mã OTP" inputmode="numeric" maxlength="6" />
                        <button class="resend-otp-button" type="button" onclick="requestResetOtp()">Gửi lại OTP</button>
                    </div>

                    <button class="secondary-button" id="verifyOtpButton" onclick="verifyResetOtp()">Xác nhận OTP</button>
                </div>

                <div id="resetPasswordFields" class="hidden">
                    <div class="form-group">
                        <label for="newPassword">Mật khẩu mới</label>
                        <input type="password" id="newPassword" placeholder="Tối thiểu 6 ký tự"
                            autocomplete="new-password" />
                    </div>

                    <button class="primary-button" id="resetPasswordButton" onclick="resetPassword()">Đặt lại mật
                        khẩu</button>
                </div>

                <p id="forgotMessage" class="status-text"></p>
                <p id="forgotError" class="error-text"></p>

            </section>
        </div>
    </div>
    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/ui.js"></script>
    <script src="auth.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
